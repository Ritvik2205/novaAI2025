[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-rag"
version = "0.1.0"
description = "Multi-tenant Retrieval-Augmented Generation platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "sqlmodel>=0.0.16",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.3",
    "python-dotenv>=1.0.0",
    "redis>=5.0.1",
    "celery>=5.3.6",
    "playwright>=1.42.0",
    "pandas>=2.2.0",
    "pypdf>=4.0.0",
    "pdfminer.six>=20231228",
    "pytesseract>=0.3.10",
    "Pillow>=10.2.0",
    "python-docx>=1.0.0",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "httpx>=0.26.0",
    "openai>=1.14.2",
    "sentence-transformers>=2.5.1",
    "torch>=2.1.0",
    "elasticsearch>=8.12.0",
    "tenacity>=8.2.3",
    "python-multipart>=0.0.9",
    "reportlab>=4.0.8",
    "PyYAML>=6.0.1",
    "email-validator>=2.1.0.post1",
    "cryptography>=42.0.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "requests-mock>=1.11.0",
    "fakeredis>=2.20.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.flake8]
max-line-length = 100
ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
